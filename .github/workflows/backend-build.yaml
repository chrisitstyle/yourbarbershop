name: Backend Build & Test

# The workflow will run on pushes and Pull Requests to the main branch,
# but only when changes are made to the backend code or the Dockerfile
on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "DockerFileBackend"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "DockerFileBackend"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      # create .env files from prepared templates
      - name: Create .env files
        run: |
          cp .env_example .env
          cp backend/.env_example backend/.env

      # grant execute permissions to the Gradle wrapper
      - name: Grant execute permission for gradlew
        working-directory: ./backend
        run: chmod +x gradlew

      # run tests
      - name: Run tests with Gradle
        working-directory: ./backend
        run: ./gradlew test --no-daemon
        env:
          # disables Ryuk to resolve Testcontainers issues when running via "act" tool on local machine
          TESTCONTAINERS_RYUK_DISABLED:
            "true"
            # overrides default localhost address to allow Testcontainers to connect to services running on the host machine when running via "act" tool on local machine
          TESTCONTAINERS_HOST_OVERRIDE: "host.docker.internal"

      # verify docker image
      - name: Build Docker image
        run: docker build -f DockerFileBackend -t barbershop-backend:${{ github.sha }} .
