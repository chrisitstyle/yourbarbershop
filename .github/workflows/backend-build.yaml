name: Backend Build

# The workflow will run on pushes and pull requests to the main branch,
# but only when changes are made to the backend code or the Dockerfile
on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "DockerFileBackend"
      - ".github/workflows/backend-build.yaml"

  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "DockerFileBackend"
      - ".github/workflows/backend-build.yaml"

permissions:
  contents: read

concurrency:
  group: backend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      # Create .env files from prepared templates
      - name: Create .env files
        run: |
          cp .env_example .env
          cp backend/.env_example backend/.env

      # Grant execute permissions to the Gradle wrapper
      - name: Grant execute permission for Gradle wrapper
        working-directory: ./backend
        run: chmod +x gradlew

      # Compile the backend and run tests and other verification tasks
      - name: Run backend checks
        working-directory: ./backend
        run: ./gradlew check --no-daemon

      # Build the Docker image only when backend checks pass
      - name: Build Docker image
        run: docker build -f DockerFileBackend -t barbershop-backend:${{ github.sha }} .
