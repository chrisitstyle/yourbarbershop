name: Backend Build

# The workflow will run on pushes and Pull Requests to the main branch,
# but only when changes are made to the backend code or the Dockerfile
on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "DockerFileBackend"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "DockerFileBackend"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      # create .env files from prepared templates
      - name: Create .env files
        run: |
          cp .env_example .env
          cp backend/.env_example backend/.env

      # grant execute permissions to the Gradle wrapper
      - name: Grant execute permission for gradlew
        working-directory: ./backend
        run: chmod +x gradlew

      # verify docker image
      - name: Build Docker image
        run: docker build -f DockerFileBackend -t barbershop-backend:${{ github.sha }} .
