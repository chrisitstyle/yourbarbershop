name: Database Migration Check

on:
  push:
    branches: ["main"]
    paths:
      - "backend/src/main/resources/db/migration/**"
      - "backend/build.gradle"
      - "backend/settings.gradle"
      - "backend/gradle/**"
      - "backend/gradlew"
      - ".github/workflows/db-migration-check.yaml"

  pull_request:
    branches: ["main"]
    paths:
      - "backend/src/main/resources/db/migration/**"
      - "backend/build.gradle"
      - "backend/settings.gradle"
      - "backend/gradle/**"
      - "backend/gradlew"
      - ".github/workflows/db-migration-check.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-migrations:
    name: Validate database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: barbershop
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for Gradle wrapper
        working-directory: ./backend
        run: chmod +x gradlew

      - name: Apply migrations to clean database
        working-directory: ./backend
        run: |
          ./gradlew flywayMigrate --no-daemon \
            -Dflyway.url=jdbc:mysql://127.0.0.1:3306/barbershop \
            -Dflyway.user=user \
            -Dflyway.password=password
