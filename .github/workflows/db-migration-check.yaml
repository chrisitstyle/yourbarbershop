name: Database Migration Check

# Validate Flyway migrations when SQL files or the Gradle/Flyway configuration
# that executes them changes.
on:
  push:
    branches: [main]
    paths:
      - "backend/src/main/resources/db/migration/**"
      - "backend/src/main/resources/db/dev-migration/**"
      - "backend/build.gradle"
      - "backend/settings.gradle"
      - "backend/gradle/**"
      - "backend/gradlew"
      - ".github/workflows/db-migration-check.yaml"

  pull_request:
    branches: [main]
    paths:
      - "backend/src/main/resources/db/migration/**"
      - "backend/src/main/resources/db/dev-migration/**"
      - "backend/build.gradle"
      - "backend/settings.gradle"
      - "backend/gradle/**"
      - "backend/gradlew"
      - ".github/workflows/db-migration-check.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-migrations:
    name: Validate PR migrations against main
    # For a pull request, first recreate the schema from the target commit and
    # then execute the PR migrations against that existing schema.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # These credentials belong only to the disposable MySQL service on the runner.
    # Production credentials must never be stored directly in a workflow file.
    env:
      FLYWAY_URL: jdbc:mysql://127.0.0.1:3306/barbershop
      FLYWAY_USER: user
      FLYWAY_PASSWORD: password

    services:
      mysql:
        # Pin the supported MySQL release line to avoid an unexpected major upgrade.
        image: mysql:8.0
        env:
          MYSQL_DATABASE: barbershop
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        # Job steps start only after MySQL accepts connections.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    steps:
      - name: Checkout base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Checkout pull request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"
          # Both revisions are checked out outside the default workspace path.
          cache-dependency-path: |
            base/backend/build.gradle
            base/backend/settings.gradle
            base/backend/gradle/wrapper/gradle-wrapper.properties
            pr/backend/build.gradle
            pr/backend/settings.gradle
            pr/backend/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permissions for Gradle wrappers
        run: |
          chmod +x base/backend/gradlew
          chmod +x pr/backend/gradlew

      # Build the exact database state expected by the target branch.
      - name: Apply migrations from base commit
        working-directory: ./base/backend
        run: |
          ./gradlew flywayMigrate --no-daemon --stacktrace \
            -Dflyway.url="$FLYWAY_URL" \
            -Dflyway.user="$FLYWAY_USER" \
            -Dflyway.password="$FLYWAY_PASSWORD" \
            -Dflyway.validateOnMigrate=true

      # This catches modified checksums, invalid SQL and migrations that cannot be
      # applied after the current production-like history.
      - name: Apply migrations from pull request
        working-directory: ./pr/backend
        run: |
          ./gradlew flywayMigrate --no-daemon --stacktrace \
            -Dflyway.url="$FLYWAY_URL" \
            -Dflyway.user="$FLYWAY_USER" \
            -Dflyway.password="$FLYWAY_PASSWORD" \
            -Dflyway.validateOnMigrate=true

      # Explicit validation makes the final schema-history verification visible
      # as a separate step in the Actions log.
      - name: Validate resulting migration history
        working-directory: ./pr/backend
        run: |
          ./gradlew flywayValidate --no-daemon --stacktrace \
            -Dflyway.url="$FLYWAY_URL" \
            -Dflyway.user="$FLYWAY_USER" \
            -Dflyway.password="$FLYWAY_PASSWORD"

  validate-current-migrations:
    name:
      Validate current migrations on clean database
      # Validate the current revision from an empty schema for every workflow run.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FLYWAY_URL: jdbc:mysql://127.0.0.1:3306/barbershop
      FLYWAY_USER: user
      FLYWAY_PASSWORD: password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: barbershop
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"
          cache-dependency-path: |
            backend/build.gradle
            backend/settings.gradle
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for Gradle wrapper
        working-directory: ./backend
        run: chmod +x gradlew

      # Rebuilding the schema from zero verifies the complete migration chain,
      # not only an upgrade from an already prepared database.
      - name: Apply migrations to clean database
        working-directory: ./backend
        run: |
          ./gradlew flywayMigrate --no-daemon --stacktrace \
            -Dflyway.url="$FLYWAY_URL" \
            -Dflyway.user="$FLYWAY_USER" \
            -Dflyway.password="$FLYWAY_PASSWORD" \
            -Dflyway.validateOnMigrate=true

      - name: Validate resulting migration history
        working-directory: ./backend
        run: |
          ./gradlew flywayValidate --no-daemon --stacktrace \
            -Dflyway.url="$FLYWAY_URL" \
            -Dflyway.user="$FLYWAY_USER" \
            -Dflyway.password="$FLYWAY_PASSWORD"
