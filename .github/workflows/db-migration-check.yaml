name: Database Migration Check

# Workflow runs when changes are made to the database migration scripts in the backend
on:
  push:
    branches: ["main"]
    paths:
      - "backend/src/main/resources/db/migration/**"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/src/main/resources/db/migration/**"

jobs:
  validate-migrations:
    runs-on: ubuntu-latest

    # Container with MySQL database
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: barbershop
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        # Health check to ensure MySQL is ready before running Flyway
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        working-directory: ./backend
        run: chmod +x gradlew

      # Run Flyway Check
      - name: Run Flyway Check
        working-directory: ./backend
        run: >
          ./gradlew flywayMigrate 
          -Dflyway.url=jdbc:mysql://127.0.0.1:3306/barbershop 
          -Dflyway.user=user 
          -Dflyway.password=password
