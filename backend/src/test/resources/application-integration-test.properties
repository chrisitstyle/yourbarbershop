# integration tests use the same production Flyway migrations as the application
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# test data is loaded explicitly with @Sql
spring.sql.init.mode=never

spring.security.oauth2.client.registration.github.client-id=dummy-client-id
spring.security.oauth2.client.registration.github.client-secret=dummy-client-secret
spring.security.oauth2.client.registration.google.client-id=dummy-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-client-secret

google.recaptcha.secret=dummy_secret_key_for_testing
google.recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# Payment links
payment.link-secret=payment-link-secret-for-integration-tests
