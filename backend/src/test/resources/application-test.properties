spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway is the only source of truth for the database schema in tests
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# do not initialize the database with schema.sql or data.sql
spring.sql.init.mode=never

spring.mail.host=localhost

# reCAPTCHA test configuration
google.recaptcha.secret=dummy-recaptcha-secret
google.recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# OAuth2 test configuration
spring.security.oauth2.client.registration.google.client-id=dummy-google-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile