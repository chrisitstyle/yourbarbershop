spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=testadmin
spring.datasource.password=testpassword

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.mail.host=localhost
spring.sql.init.schema-locations=classpath:schema.sql
spring.flyway.enabled=false

# reCAPTCHA test configuration
google.recaptcha.secret=dummy-recaptcha-secret
google.recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# OAuth2 test configuration
spring.security.oauth2.client.registration.google.client-id=dummy-google-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile